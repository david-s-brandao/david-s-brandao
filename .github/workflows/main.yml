# Adapted from https://github.com/mari4souza/mari4souza/blob/main/.github/workflows/main.yml
name: Update contribution animation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#147B91&color_dots=#E8EEF5,#BDDFEA,#80C4D2,#46A2B5,#147B91
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFB454&color_dots=#152336,#204557,#327082,#4AA7B5,#73DCE8

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
