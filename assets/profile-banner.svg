<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">David Brandão — Networking and Infrastructure Student</title>
  <desc id="description">Networks and infrastructure, with cloud on top. Eight cable strands converging into an Ethernet connector.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111113" />
      <stop offset="1" stop-color="#0b0b0c" />
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f66008" />
      <stop offset="0.6" stop-color="#f66008" stop-opacity="0.2" />
      <stop offset="1" stop-color="#f66008" />
    </linearGradient>
    <linearGradient id="fade" x1="660" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0" />
      <stop offset="1" stop-color="#fff" />
    </linearGradient>
    <mask id="strand-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <rect x="660" width="540" height="360" fill="url(#fade)" />
    </mask>
    <clipPath id="bounds">
      <rect width="1200" height="360" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#bounds)">
    <rect width="1200" height="360" fill="url(#background)" />
    <path d="M64 1H1136" stroke="url(#accent)" stroke-width="3" />
    <path d="M64 284H644" stroke="#26262b" />

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="64" y="65" width="28" height="3" rx="1.5" fill="#f66008" />
      <text x="108" y="72" fill="#f66008" font-size="15" font-weight="600" letter-spacing="3">NETWORKING + INFRASTRUCTURE STUDENT</text>
      <text x="60" y="161" fill="#ececf0" font-size="72" font-weight="700" letter-spacing="-2.5">David Brandão</text>
      <text x="64" y="211" fill="#a1a1aa" font-size="24">Networks and infrastructure,</text>
      <text x="64" y="243" fill="#a1a1aa" font-size="24">with cloud on top.</text>
      <g font-size="13" font-weight="500" letter-spacing="1.6">
        <text x="64" y="317" fill="#f66008">CCNA</text>
        <text x="120" y="317" fill="#4a4a52">/</text>
        <text x="142" y="317" fill="#a1a1aa">AWS GAMEDAY PORTUGAL 2026</text>
        <text x="406" y="317" fill="#4a4a52">/</text>
        <text x="428" y="317" fill="#a1a1aa">AUTOMATION</text>
      </g>
    </g>

    <g stroke-width="3.5" stroke-linecap="round" mask="url(#strand-mask)">
      <path d="M660 70 C 830 70, 850 155.0, 1010 155.0 H1100" stroke="#f66008" stroke-opacity="0.9" />
      <path d="M660 101 C 830 101, 850 162.2, 1010 162.2 H1100" stroke="#ececf0" stroke-opacity="0.32" />
      <path d="M660 132 C 830 132, 850 169.4, 1010 169.4 H1100" stroke="#f66008" stroke-opacity="0.9" />
      <path d="M660 163 C 830 163, 850 176.6, 1010 176.6 H1100" stroke="#ececf0" stroke-opacity="0.32" />
      <path d="M660 194 C 830 194, 850 183.8, 1010 183.8 H1100" stroke="#f66008" stroke-opacity="0.9" />
      <path d="M660 225 C 830 225, 850 191.0, 1010 191.0 H1100" stroke="#ececf0" stroke-opacity="0.32" />
      <path d="M660 256 C 830 256, 850 198.2, 1010 198.2 H1100" stroke="#f66008" stroke-opacity="0.9" />
      <path d="M660 287 C 830 287, 850 205.4, 1010 205.4 H1100" stroke="#ececf0" stroke-opacity="0.32" />
