    <rect x="1060" y="143" width="34" height="74" rx="8" fill="#1c1c1f" stroke="#3a3a40" />
    <rect x="1094" y="136" width="66" height="88" rx="10" fill="#161618" stroke="#3a3a40" />
    <rect x="1160" y="153.5" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" /><rect x="1160" y="160.7" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" /><rect x="1160" y="167.9" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" /><rect x="1160" y="175.1" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" /><rect x="1160" y="182.3" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" /><rect x="1160" y="189.5" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" /><rect x="1160" y="196.7" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" /><rect x="1160" y="203.9" width="22" height="3" rx="1.5" fill="#f66008" fill-opacity="0.9" />
