<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">David Brandão — Cloud + Networking Student</title>
  <desc id="description">Building cloud systems, from the network up. AWS, serverless and infrastructure as code. A cloud connects to compute, code and storage nodes on a dark blue architectural grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D192B" />
      <stop offset="1" stop-color="#09111E" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(946 156) rotate(90) scale(245 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163F50" stop-opacity="0.6" />
      <stop offset="1" stop-color="#163F50" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68D8E8" />
      <stop offset="0.6" stop-color="#68D8E8" stop-opacity="0.18" />
      <stop offset="1" stop-color="#FFB454" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#83ADC8" stroke-opacity="0.07" />
    </pattern>
    <clipPath id="bounds">
      <rect width="1200" height="360" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#bounds)">
    <rect width="1200" height="360" fill="url(#background)" />
    <rect x="704" width="496" height="360" fill="url(#glow)" />
    <rect x="704" width="496" height="360" fill="url(#grid)" />
    <path d="M64 1H1136" stroke="url(#accent)" stroke-width="3" />
    <path d="M64 284H644" stroke="#243449" />

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="64" y="65" width="28" height="3" rx="1.5" fill="#FFB454" />
      <text x="108" y="72" fill="#73DCE8" font-size="15" font-weight="600" letter-spacing="3">CLOUD + NETWORKING STUDENT</text>
      <text x="60" y="161" fill="#F0F6FC" font-size="72" font-weight="700" letter-spacing="-2.5">David Brandão</text>
      <text x="64" y="211" fill="#B5C5D8" font-size="24">Building cloud systems,</text>
      <text x="64" y="243" fill="#B5C5D8" font-size="24">from the network up.</text>
      <g font-size="13" font-weight="500" letter-spacing="1.6">
        <text x="64" y="317" fill="#FFB454">AWS</text>
        <text x="111" y="317" fill="#486078">/</text>
        <text x="133" y="317" fill="#A7BCD1">SERVERLESS</text>
        <text x="253" y="317" fill="#486078">/</text>
        <text x="275" y="317" fill="#A7BCD1">INFRASTRUCTURE AS CODE</text>
      </g>
    </g>

    <g stroke-linecap="round" stroke-linejoin="round">
