      <stop offset="0.6" stop-color="#f66008" stop-opacity="0.2" />
      <stop offset="1" stop-color="#f66008" />
    </linearGradient>
    <linearGradient id="cable-fade" x1="720" y1="0" x2="990" y2="0" gradientUnits="userSpaceOnUse">
